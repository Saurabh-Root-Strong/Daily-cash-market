#
# RECONCILED against fno_bhavcopy 2026-08-06: entries here must match the days the
# exchange actually did NOT trade. The file had 9 missing holidays and 2 entries
# (2025-10-21, 2026-04-22) on which NSE DID trade. src/analytics/fno_stocks.py
# _sessions_until() reads this to time the pre-expiry guard, so drift costs a day.

